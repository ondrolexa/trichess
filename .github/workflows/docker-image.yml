name: Check, then build and push Docker image to dockerhub

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  check:

    runs-on: ubuntu-latest

    # Same major as docker-compose.yml's postgres service; the suite runs a
    # second time against it (TEST_DATABASE_URL below).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trichess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Lint, format check, pytest on SQLite and PostgreSQL.
    - name: Check
      uses: ./.github/actions/check

  build:

    # Only after checks pass, and only for pushes to main (develop and PRs
    # just check).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to dockerhub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The Dockerfile installs dependencies with uv from uv.lock.
    - name: Build and push to dockerhub
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
       context: .
       push: true
       tags: ondrolexa/trichess:latest
       cache-from: type=gha
       cache-to: type=gha,mode=max
