name: Check, then build and push Docker image to dockerhub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  check:

    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: "0.12.24"   # same as the Dockerfile's uv image
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Lint
      run: uv run ruff check .

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Test
      run: uv run pytest

  build:

    # Only after checks pass, and only for pushes to main (PRs just check).
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to dockerhub
      uses: docker/login-action@v4
      with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The Dockerfile installs dependencies with uv from uv.lock.
    - name: Build and push to dockerhub
      uses: docker/build-push-action@v7
      with:
       context: .
       push: true
       tags: ondrolexa/trichess:latest
       cache-from: type=gha
       cache-to: type=gha,mode=max
