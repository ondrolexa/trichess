# Default `docker compose up`: the whole stack in containers on this machine,
# built from the working tree and reachable directly (no Traefik): app on
# http://localhost:8080, live board updates (SSE) on http://localhost:8090.
# docker-compose.dev.yml is PostgreSQL alone for running Flask on the host.
#
# NOT for servers
# This file binds the same ./pgdata as the server stack, and two postgres
# containers on one data directory don't detect each other — it corrupts it.
#
#   mkdir -p pgdata instance        # once; must exist and be yours (uid 1000)
#   docker compose up -d --build
#
# .env needs POSTGRES_PASSWORD (plus the usual secrets). The database
# settings below override any dev values in .env.
#
# Database contents: an empty ./pgdata initialises itself from
# ./instance/trichess.sql (e.g. production's latest dump). Without a dump,
# copy the legacy SQLite database in once instead:
#   docker compose run --rm trichess \
#     flask --app=webapp sqlite-to-postgres --sqlite /code/instance/trichess.db
#
# Shares ./pgdata with docker-compose.dev.yml. Both publish 127.0.0.1:5432,
# so only one of them can run at a time — two servers on one data directory
# would corrupt it.
name: trichess-local

x-app: &app
  build: .
  image: trichess:local
  env_file: ".env"
  restart: unless-stopped
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    redis:
      condition: service_started
    postgres:
      condition: service_healthy

x-db-env: &db-env
  REDIS_URL: redis://redis:6379/0
  SQLALCHEMY_DATABASE_URI: postgresql+psycopg://trichess:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/trichess

services:

  trichess:
    <<: *app
    environment:
      <<: *db-env
      # The board page opens its EventSource on the SSE service's own port
      # (no Traefik to route the events path on one origin).
      SSE_URL: http://localhost:8090
    volumes:
      - ./instance:/code/instance
    ports:
      - "127.0.0.1:8080:8080"

  trichess-sse:
    <<: *app
    # --no-access-log: the stream URL carries the user's JWT (?jwt=).
    command: uvicorn sse.app:app --host 0.0.0.0 --port 8090 --no-access-log
    environment:
      <<: *db-env
      # Cross-origin from the app's page: allow exactly that origin.
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8090:8090"

  trichess-worker:
    <<: *app
    command: rq worker notifications bot --url redis://redis:6379/0
    cpus: "0.9"
    environment:
      <<: *db-env
      PYTHONPATH: /code
    volumes:
      - ./instance:/code/instance

  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: trichess
      POSTGRES_USER: trichess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./instance:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trichess -d trichess"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
