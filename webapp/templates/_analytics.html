{# Google Analytics 4 — rendered only when render_template() passes a ga_config
   (GA_MEASUREMENT_ID set, not debug, not admin). Consent defaults to denied;
   analytics.js loads gtag.js only after the visitor accepts the banner. #}
{% if ga_config %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("consent", "default", {
    analytics_storage: "denied",
    ad_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied",
  });
  window.TRICHESS_GA = {{ ga_config|tojson }};
</script>
<script src="{{ url_for('static', filename='analytics.js') }}" defer></script>
{% endif %}
